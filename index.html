function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function parseStoreMap(lines){
  const map=new Map();
  for(const line of lines){
    if(!line.includes("|")) continue;
    const parts=line.split("|");
    if(parts.length<5) continue;
    const product=parts[0].trim(); const aisle=parts[1].trim().toUpperCase(); const unit=parts[2].trim().toUpperCase(); const code=parts[4].trim();
    if(!product||!aisle||!unit) continue;
    const key=product.toLowerCase();
    if(!map.has(key)) map.set(key,{product,locations:[]});
    const entry=map.get(key);
    // avoid duplicate aisle+unit
    if(!entry.locations.some(l=>l.aisle===aisle&&l.unit===unit)) entry.locations.push({aisle,unit,code});
  }
  // sort locations by route order
  return map;
}

function parseQtyAndClean(input){
  let qty=1;
  let s=input.trim();
  // detect x2, *2, QTY 2, etc at end
  const m=s.match(/(?:\s*[xX*]\s*|\s+QTY\s+|\s+)(\d+)\s*$/);
  if(m){ qty=parseInt(m[1],10)||1; s=s.slice(0,m.index).trim(); }
  // if line is just a product code number
  if(/^\d{5,6}$/.test(s)){ return {clean:s, qty, isCode:true} }
  return {clean:s, qty, isCode:false};
}

function normalize(str){return str.toLowerCase().replace(/[^a-z0-9]/g,'');}

function buildPick(listText, storeMap, routeText){
  const route=(routeText||DEFAULT_ROUTE).split(",").map(s=>s.trim().toUpperCase()).filter(Boolean);
  const routeIndex=a=>{const i=route.indexOf(a.toUpperCase()); return i===-1?999:i;};
  const rawLines=listText.split("\n").map(l=>l.trim()).filter(Boolean);
  const seen=new Set(); let duplicateCount=0;
  const items=[];
  let idCounter=0;
  for(const raw of rawLines){
    const {clean,qty,isCode}=parseQtyAndClean(raw);
    if(!clean) continue;
    const dedupKey=clean.toLowerCase()+"|"+qty;
    if(seen.has(dedupKey)){duplicateCount++; continue;} seen.add(dedupKey);
    
    let matchedEntry=null; let matchedKey=null;
    if(isCode){
      // match by code
      for(const [k,v] of storeMap.entries()){
        if(v.locations.some(l=>l.code===clean)){matchedEntry=v; matchedKey=k; break;}
      }
    } else {
      const low=clean.toLowerCase();
      // exact product match first
      if(storeMap.has(low)){matchedEntry=storeMap.get(low); matchedKey=low;}
      else {
        // fuzzy: product contains input or input contains product words
        // try normalize includes
        const nInput=normalize(clean);
        let best=null; let bestScore=0;
        for(const [k,v] of storeMap.entries()){
          const nProd=normalize(v.product);
          if(nProd.includes(nInput) || nInput.includes(nProd)){ 
            // score by length overlap
            const score=Math.min(nProd.length,nInput.length)/Math.max(nProd.length,nInput.length);
            if(score>bestScore){bestScore=score; best=v; matchedKey=k;}
          }
        }
        // Also try word overlap for improved names
        if(!best){
          const words=low.split(/\s+/).filter(w=>w.length>2);
          for(const [k,v] of storeMap.entries()){
            const prodLow=v.product.toLowerCase();
            const overlap=words.filter(w=>prodLow.includes(w)).length;
            if(overlap>=Math.max(1, Math.ceil(words.length*0.6))){
              if(overlap>bestScore){bestScore=overlap; best=v; matchedKey=k;}
            }
          }
        }
        matchedEntry=best;
      }
    }
    
    if(matchedEntry){
      // sort locations by route
      const locs=[...matchedEntry.locations].sort((a,b)=>{
        const ra=routeIndex(a.aisle); const rb=routeIndex(b.aisle);
        if(ra!==rb) return ra-rb;
        return a.unit.localeCompare(b.unit);
      });
      const primary=locs[0];
      items.push({id:idCounter++, product:matchedEntry.product, aisle:primary.aisle, unit:primary.unit, code:primary.code, locations:locs, qty, matched:true, raw});
    } else {
      items.push({id:idCounter++, product:clean, aisle:"", unit:"", code:isCode?clean:"", locations:[], qty, matched:false, raw});
    }
  }
  // Sort pick by aisle walk
  items.sort((a,b)=>{
    if(!a.matched && b.matched) return 1; if(a.matched && !b.matched) return -1;
    if(!a.matched && !b.matched) return 0;
    const ra=routeIndex(a.aisle); const rb=routeIndex(b.aisle);
    if(ra!==rb) return ra-rb;
    const ua=a.unit.localeCompare(b.unit); if(ua!==0) return ua;
    return a.product.localeCompare(b.product);
  });
  return {pick:items, duplicateCount};
}

}

      card.innerHTML=`
        <div class="gip-location"><small>AISLE</small><strong>${escapeHtml(item.aisle)}</strong><small>UNIT</small><span>${escapeHtml(item.unit)}</span></div>
        <div class="gip-product"><h3>${escapeHtml(item.product)}</h3><p class="gip-meta"><span class="gip-code">CODE ${escapeHtml(item.code||"N/A")}</span><span class="gip-qty">QTY ${item.qty}</span><span>${escapeHtml(item.raw)}</span></p>${also?`<p class="gip-also">${alsoCodeExtra}</p>`:""}</div>
        <div class="gip-actions">
          <button class="gip-toggle" type="button" aria-pressed="${picked.has(item.id)}">${picked.has(item.id)?"✓":"○"}</button>
          <button class="gip-maybe-btn" type="button" title="Hard to locate - show ALSO">${isMaybe?"MAYBE":"?"}</button>
        </div>`;
      card.querySelector(".gip-toggle").addEventListener("click",()=>{picked.has(item.id)?picked.delete(item.id):picked.add(item.id); persistPicked(); renderPick();});
      card.querySelector(".gip-maybe-btn").addEventListener("click",()=>{isMaybe?maybeSet.delete(item.id):maybeSet.add(item.id); persistMaybe(); renderPick();});
    } else {
      card.innerHTML=`
        <div class="gip-unmatched-top" style="display:flex;gap:8px;flex:1"><span class="gip-alert">!</span><div><h3>${escapeHtml(item.product)}</h3><p class="gip-meta">CODE ${escapeHtml(item.code||"N/A")} · QTY ${item.qty} · NO SAFE MATCH - Try CODE or fuller name</p></div></div>
        <div class="gip-assign"><label>AISLE<input class="gip-input" data-aisle placeholder="A3" maxlength="4"></label><label>UNIT<input class="gip-input" data-unit placeholder="LF7" maxlength="6"></label><button class="gip-dark" type="button">Save</button></div>`;
      card.querySelector("button").addEventListener("click",()=>saveLocation(item,card));
    }
    results.append(card);
  }
  updateProgress();
}

function saveLocation(item,card){
  const aisle=card.querySelector("[data-aisle]").value.trim().toUpperCase(); const unit=card.querySelector("[data-unit]").value.trim().toUpperCase();
  if(!/^A\d+$/.test(aisle) || !/^[A-Z]+\d*$/.test(unit)){setMessage("Use aisle A1-A6 and unit like RF1, LS9","error");return;}
  const custom=JSON.parse(localStorage.getItem(STORAGE.customMap)||"[]"); const code=item.code||"";
  custom.push(`${item.product}|${aisle}|${unit}||${code}`);
  localStorage.setItem(STORAGE.customMap, JSON.stringify(custom));
  setMessage(`${item.product} saved at ${aisle} ${unit}`,"ok"); createPick(false);
}

function createPick(resetChecks=true){
  const listText=$("gip-list").value; if(!listText.trim()){setMessage("Paste at least one product first","error");$("gip-list").focus();return;}
  localStorage.setItem(STORAGE.list,listText); localStorage.setItem(STORAGE.route,$("gip-route").value.trim()||DEFAULT_ROUTE);
  if(resetChecks){picked=new Set(); maybeSet=new Set(); persistPicked(); persistMaybe();}
  const result=buildPick(listText, parseStoreMap(allMapLines()), $("gip-route").value);
  pick=result.pick; const unmatched=pick.filter(i=>!i.matched).length; const units=pick.reduce((s,i)=>s+i.qty,0);
  const dupMsg=result.duplicateCount?` ${result.duplicateCount} duplicate photo lines removed.`:"";
  setMessage(unmatched?`${pick.length} lines (${units} units): ${pick.length-unmatched} located, ${unmatched} needs location.${dupMsg}`:`${pick.length} lines (${units} units) located and sorted A1→A6.${dupMsg}`, unmatched?"warn":"ok");
  renderPick(); $("gip-results").scrollIntoView({behavior:"smooth",block:"start"});
}

$("gip-create").addEventListener("click",()=>createPick(true));
$("gip-sample").addEventListener("click",()=>{$("gip-list").value=SAMPLE_LIST; setMessage("Test list loaded. Tap Create sorted pick.");});
$("gip-clear").addEventListener("click",()=>{$("gip-list").value=""; pick=[]; picked=new Set(); maybeSet=new Set(); persistPicked(); persistMaybe(); localStorage.removeItem(STORAGE.list); renderPick(); setMessage("List cleared.");});
$("gip-reset-ticks").addEventListener("click",()=>{picked=new Set(); maybeSet=new Set(); persistPicked(); persistMaybe(); renderPick();});
$("gip-mark-all").addEventListener("click",()=>{pick.filter(i=>i.matched).forEach(i=>picked.add(i.id)); persistPicked(); renderPick();});
$("gip-route").addEventListener("change",()=>{localStorage.setItem(STORAGE.route,$("gip-route").value.trim()||DEFAULT_ROUTE); if(pick.length) createPick(false);});
$("gip-reset-locations").addEventListener("click",()=>{localStorage.removeItem(STORAGE.customMap); setMessage("Custom locations removed","ok"); if(pick.length) createPick(false);});
$("gip-copy").addEventListener("click", async()=>{
  const lines=pick.map(i=>i.matched?`${i.product} | CODE ${i.code||"N/A"} | QTY ${i.qty} | ${i.locations.map(l=>`${l.aisle} ${l.unit}`).join(" / ")}`:`${i.product} | CODE ${i.code||"N/A"} | QTY ${i.qty} | NO MATCH`);
  try{await navigator.clipboard.writeText(lines.join("\n")); setMessage("Sorted pick copied","ok");}catch{setMessage("Copy blocked","error");}
});
$("gip-list").value=localStorage.getItem(STORAGE.list)||""; $("gip-route").value=localStorage.getItem(STORAGE.route)||DEFAULT_ROUTE;
if($("gip-list").value.trim()) createPick(false);
</script>
</body>
